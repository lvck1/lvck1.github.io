<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>我的博客</title>
	<link rel="stylesheet" href="assets/style.css">

	<link rel="icon" type="image/png" href="icons/icon-192.png">
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#0b241d">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="拾账">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>

<body>
	<header class="site-header">
		<div class="container">
			<h1 class="site-title">我的博客</h1>
			<p class="site-desc">基于纯静态 HTML/CSS/JS 的示例站点</p>
		</div>
	</header>

	<main class="container">
		<section id="posts-section">
			<h2>文章</h2>
			<ul id="posts-list" class="posts-list">
				<!-- 列表由 assets/main.js 自动填充（读取 posts/posts.json） -->
			</ul>
		</section>
	</main>

	<footer class="site-footer">
		<div class="container">&copy; <span id="year"></span> 我的博客</div>
	</footer>

	<script src="assets/main.js"></script>

	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { }));
		}
	</script>
</body>

</html>
