<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="页面未找到（404）。返回首页或在站内搜索你需要的内容。">
    <meta name="robots" content="noindex">
    <title>页面不见啦 - 我的知识库</title>
    <!-- 使用你网站的主样式，确保风格统一 -->
    <link rel="stylesheet" href="assets/style.css">
    <style>
        /* 404 页面局部布局（细节样式放在 assets/style.css 中） */
        .error-container{ text-align:center; padding:60px 20px; min-height:60vh; display:flex; flex-direction:column; justify-content:center; align-items:center }
        .error-message{ font-size:1.6rem; margin-bottom:18px; color:#2c3e50 }
        .action-links{ margin-top:20px }
        .action-links a{ display:inline-block; margin:6px 8px; padding:10px 22px; background:#3498db; color:#fff; text-decoration:none; border-radius:6px }
        .action-links a:hover{ background:#2980b9 }
        @media (max-width:600px){ .error-message{ font-size:1.2rem } .action-links a{ display:block; margin:8px auto; max-width:260px } }
    </style>
</head>
<body>
        <!-- 复用与首页相同的页眉 -->
        <header class="site-header">
            <div class="container">
                <h1 class="site-title"><a href="/" style="text-decoration:none;color:inherit;">我的博客</a></h1>
                <p class="site-desc">基于纯静态 HTML/CSS/JS 的示例站点</p>
            </div>
        </header>

    <main id="main" role="main">
        <div class="error-container">
            <!-- 错误代码和趣味信息 -->
                        <div class="illustration" aria-hidden="true">
                                <!-- 更精美的插画 SVG（可替换为你喜欢的 SVG/图片） -->
                                <svg width="260" height="160" viewBox="0 0 260 160" xmlns="http://www.w3.org/2000/svg" role="img">
                                        <title>友好迷路插画</title>
                                        <defs>
                                            <linearGradient id="g1" x1="0" x2="1">
                                                <stop offset="0" stop-color="#e6f3ff"/>
                                                <stop offset="1" stop-color="#f7fbff"/>
                                            </linearGradient>
                                        </defs>
                                        <rect width="260" height="160" rx="12" fill="url(#g1)"/>
                                        <g transform="translate(28,18)">
                                            <path d="M10 100 C32 80, 60 68, 96 72 C132 76, 156 92, 200 84" stroke="#bfe1ff" stroke-width="6" fill="none" stroke-linecap="round"/>
                                            <g transform="translate(6,10)">
                                                <circle cx="24" cy="36" r="18" fill="#fff" stroke="#cfe9ff"/>
                                                <path d="M18 46 q6 6 12 0" stroke="#ffd6a6" stroke-width="3" fill="none" stroke-linecap="round"/>
                                            </g>
                                            <g transform="translate(92,10)">
                                                <rect x="0" y="10" width="86" height="44" rx="8" fill="#fff" stroke="#d6edff"/>
                                                <path d="M10 24 h66" stroke="#cfe9ff" stroke-width="2"/>
                                                <path d="M10 34 h46" stroke="#e9f6ff" stroke-width="2"/>
                                            </g>
                                            <text x="44" y="86" font-size="14" fill="#7aaef9">迷路了？我们来帮你找回路</text>
                                        </g>
                                </svg>
                        </div>
            <div class="error-code">404</div>
            <div class="error-message">哎呀，你要找的页面好像迷路了...</div>
            <p>这可能是因为链接地址发生了变化，或者页面被移动了。</p>
            <p>别担心，你可以：</p>

            <!-- 主要操作按钮 -->
            <div class="action-links">
                <a href="/">返回首页</a>
                <a href="posts/">浏览文章</a>
                <a href="javascript:history.back()">返回上一页</a>
            </div>

                        <!-- 推荐文章（随机/最新） -->
                        <div id="recommendations" class="recommendations" aria-live="polite">
                            <h3>为你推荐</h3>
                            <ul id="recommend-list">
                                <li>正在加载推荐文章…</li>
                            </ul>
                        </div>

            <!-- 搜索功能已移除；使用推荐或返回首页即可 -->
        </div>
    </main>

    <!-- 复用与首页相同的页脚 -->
    <footer class="site-footer">
      <div class="container">&copy; <span id="year"></span> 我的博客</div>
    </footer>

    <script>
        // 已移除搜索功能（纯静态站点如需搜索，可改为客户端渲染或外部 site: 搜索）

        // 自动填充年份
        (function(){
            try{document.getElementById('year').textContent = new Date().getFullYear()}catch(e){}
        })();

                // 加载并显示推荐文章（随机或最新）
                (function loadRecommendations(){
                        const listEl = document.getElementById('recommend-list');
                        if(!listEl) return;
                        fetch('posts/posts.json')
                            .then(r=>{ if(!r.ok) throw new Error('无法读取 posts/posts.json'); return r.json() })
                            .then(posts=>{
                                if(!Array.isArray(posts) || posts.length===0){ listEl.innerHTML = '<li>暂无文章。</li>'; return }
                                // 随机抽取最多 3 篇
                                const shuffled = posts.slice().sort(()=>0.5-Math.random());
                                const pick = shuffled.slice(0, Math.min(3, posts.length));
                                listEl.innerHTML = '';
                                pick.forEach(p=>{
                                        const li = document.createElement('li');
                                        const a = document.createElement('a');
                                        a.href = p.url;
                                        a.textContent = p.title + (p.date ? (' — ' + p.date) : '');
                                        li.appendChild(a);
                                        if(p.summary){
                                            const s = document.createElement('div'); s.className='post-meta'; s.textContent = p.summary; li.appendChild(s);
                                        }
                                        listEl.appendChild(li);
                                })
                            })
                            .catch(err=>{ listEl.innerHTML = '<li>加载推荐失败。</li>'; console.warn(err) })
                })();
    </script>
</body>
</html>
