      <h1>第一篇文章：示例</h1>
      <p>欢迎！这是一个使用纯静态 HTML/CSS/JS 搭建的博客示例文章。你可以在 <code>posts/posts.json</code> 中添加新文章条目，并在 <code>posts/</code> 下创建对应的 HTML 文件。</p>
      <h2>写作建议</h2>
      <ul>
        <li>短期：继续用 HTML 文件写文章并在 posts.json 添加索引。</li>
        <li>中期：写文章用 Markdown 并在本地用脚本转换为 HTML（或用客户端渲染）。</li>
        <li>长期：如果文章数量多，考虑引入简单的构建流程（Node/Python）自动生成索引和分页。</li>
      </ul>
    </article>
